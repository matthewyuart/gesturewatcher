<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>liquid glass — package smoke test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #07070a; overflow: hidden; font-family: ui-monospace, Menlo, monospace; }
    #stage { position: fixed; inset: 0; }
    /* the "app" background the glass layers over */
    #backdrop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #glass { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
    .panel {
      position: absolute; z-index: 4; color: #fff; padding: 14px 16px;
      font-size: 12px; letter-spacing: 0.04em; text-shadow: 0 1px 6px rgba(0,0,0,.6);
    }
    #p1 { left: 60px;  top: 90px;  width: 300px; height: 170px; }
    #p2 { left: 60px;  top: 300px; width: 150px; height: 60px;  }
    #p3 { left: 240px; top: 300px; width: 150px; height: 60px;  }
    #note { position: fixed; right: 14px; bottom: 12px; z-index: 5; color: #fff; font-size: 11px; opacity: .6; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="backdrop"></canvas>
    <canvas id="glass"></canvas>
    <div class="panel" id="p1">panel one</div>
    <div class="panel" id="p2">two</div>
    <div class="panel" id="p3">three</div>
  </div>
  <div id="note">package smoke test — 3 shapes, one canvas</div>

  <script type="module">
    import { LiquidGlass } from './liquid-glass.js';
    import { GLASS_PRESET } from './glass-preset.js';

    // stand-in for the camera feed: an animated, high-contrast backdrop
    const bd = document.getElementById('backdrop');
    const bctx = bd.getContext('2d');
    function drawBackdrop(t) {
      const w = (bd.width = window.innerWidth);
      const h = (bd.height = window.innerHeight);
      const g = bctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#ff7a18');
      g.addColorStop(0.5, '#7a1fa2');
      g.addColorStop(1, '#1f9aa2');
      bctx.fillStyle = g;
      bctx.fillRect(0, 0, w, h);
      bctx.fillStyle = '#fff';
      for (let i = 0; i < 14; i++) {
        const x = ((i * 90 + t * 18) % (w + 120)) - 60;
        bctx.fillRect(x, 60 + ((i * 53) % Math.max(1, h - 260)), 26, 190);
      }
      bctx.fillStyle = '#000';
      for (let i = 0; i < 10; i++) bctx.fillRect(0, i * 90 + 40, w, 8);
    }

    const canvas = document.getElementById('glass');
    const glass = new LiquidGlass(canvas, { preset: GLASS_PRESET });
    const panels = ['p1', 'p2', 'p3'].map((id) => document.getElementById(id));

    let t0 = performance.now();
    function frame() {
      requestAnimationFrame(frame);
      const t = (performance.now() - t0) / 1000;
      drawBackdrop(t);

      glass.resize();
      glass.setSource(bd, null);
      const cr = canvas.getBoundingClientRect();
      glass.setShapes(
        panels.map((el) => {
          const r = el.getBoundingClientRect();
          return {
            x: r.left - cr.left,
            y: r.top - cr.top,
            width: r.width,
            height: r.height,
            radius: 22,
          };
        }),
      );
      glass.renderFrame();
    }
    requestAnimationFrame(frame);

    // headless panes pause rAF — keep a timer fallback so screenshots are live
    setInterval(() => { drawBackdrop(1); glass.resize(); glass.renderFrame(); }, 250);

    window.__demo = () => ({ shapes: glass.shapes.length, preset: glass.getPreset() });
  </script>
</body>
</html>
